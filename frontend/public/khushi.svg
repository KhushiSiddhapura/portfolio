<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Curvy Organic Background Blob -->
  <path d="M 60,180 C 40,80 120,40 200,40 C 300,40 360,100 350,200 C 340,300 280,360 180,360 C 80,360 80,280 60,180 Z" fill="url(#bg-grad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Back Hair -->
  <path d="M 120,160 C 100,240 110,320 130,350 C 140,360 260,360 270,350 C 290,320 300,240 280,160 Z" fill="url(#hair)"/>

  <!-- Neck & Torso -->
  <path d="M 175,220 L 225,220 L 225,260 L 175,260 Z" fill="#FBBF24"/>
  <path d="M 120,380 C 120,290 150,260 200,260 C 250,260 280,290 280,380 Z" fill="url(#jacket)"/>

  <!-- Inner Top / Collar -->
  <path d="M 180,260 L 200,310 L 220,260 Z" fill="#7C3AED"/>

  <!-- Face Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#FDE68A"/>

  <!-- Front Hair Style (curvy modern bangs) -->
  <path d="M 145,180 C 140,110 180,105 200,105 C 240,105 260,120 255,180 C 245,140 220,135 200,135 C 170,135 150,150 145,180 Z" fill="url(#hair)"/>
  <path d="M 145,160 C 130,190 135,240 145,260 C 150,240 155,200 150,170 Z" fill="url(#hair)"/>
  <path d="M 255,160 C 270,190 265,240 255,260 C 250,240 245,200 250,170 Z" fill="url(#hair)"/>

  <!-- Eyes -->
  <ellipse cx="178" cy="180" rx="5.5" ry="7" fill="#1E1B4B"/>
  <ellipse cx="222" cy="180" rx="5.5" ry="7" fill="#1E1B4B"/>
  <circle cx="180" cy="178" r="2" fill="#FFFFFF"/>
  <circle cx="224" cy="178" r="2" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M 168,166 Q 178,162 188,166" stroke="#1E1B4B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 212,166 Q 222,162 232,166" stroke="#1E1B4B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Gentle Smile -->
  <path d="M 188,205 Q 200,217 212,205" stroke="#B45309" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Subtle Blush -->
  <circle cx="165" cy="195" r="7" fill="#F87171" opacity="0.4"/>
  <circle cx="235" cy="195" r="7" fill="#F87171" opacity="0.4"/>

  <!-- Tech Glasses (Chic aesthetic purple frames) -->
  <rect x="162" y="170" width="32" height="22" rx="6" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="206" y="170" width="32" height="22" rx="6" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="194" y1="180" x2="206" y2="180" stroke="#7C3AED" stroke-width="2.5"/>

  <!-- Floating Sparkles / Code Dots -->
  <circle cx="310" cy="120" r="4" fill="#A78BFA" opacity="0.8"/>
  <circle cx="95" cy="140" r="5" fill="#7C3AED" opacity="0.6"/>
  <circle cx="320" cy="280" r="3" fill="#DDD6FE"/>
</svg>
